# Installer V2 development example: same-host nginx gateway managed by operator.
# Replace hostname, certificate paths, and the port with the installed values.
# LCC never installs or reloads this configuration.
server {
    listen 80;
    server_name lcc.example.test;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name lcc.example.test;
    ssl_certificate /etc/ssl/lcc/fullchain.pem;
    ssl_certificate_key /etc/ssl/lcc/privkey.pem;
    root /opt/learning-control-center/current/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
